<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SanSon Games</title>
<style>
  :root { --bg:#f6f8f4; --fg:#1d2a1f; --muted:#5b6b5e; --accent:#2e7d4f; --card:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a15; --fg:#e6efe7; --muted:#9fb0a2; --accent:#6fcf97; --card:#1d251f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 32px; color:var(--muted); }
  .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin:0 0 6px; font-size:20px; }
  .card p { margin:0 0 12px; color:var(--muted); }
  a { color:var(--accent); }
  .links a { margin-right:16px; }
  footer { margin-top:32px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>SanSon Games</h1>
  <p class="sub">Small casual games for Android.</p>

  <div class="card">
    <h2>Florarium</h2>
    <p>A relaxing merge puzzle: combine symbols on a 4×4 board and grow a garden of trees.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.SanSon.Florarium">Google Play</a>
      <a href="https://sanchezsuper.github.io/florarium-privacy/">Privacy Policy</a>
    </div>
  </div>

  <footer>Contact: <a href="mailto:sansoncorp@gmail.com">sansoncorp@gmail.com</a></footer>
</main>
</body>
</html>
